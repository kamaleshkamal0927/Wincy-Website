<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="chessGradLight" x1="8" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A21CAF" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- Chess Crown / King Emblem -->
  <g transform="translate(4, 4)">
    <!-- Base plate -->
    <path d="M12 48 H44 C45.5 48 46 49.5 45 51 C43.5 53 41 54 28 54 C15 54 12.5 53 11 51 C10 49.5 10.5 48 12 48 Z" fill="url(#chessGradLight)" />
    <!-- Pedestal ring -->
    <rect x="15" y="44" width="26" height="3" rx="1.5" fill="#C026D3" opacity="0.9" />
    <!-- Body curve of King piece -->
    <path d="M17 43 C19 36 21 32 16 26 C13 22 13 18 16 16 C18 14 21 16 23 18 C25 15 27 13 28 12 C29 13 31 15 33 18 C35 16 38 14 40 16 C43 18 43 22 40 26 C35 32 37 36 39 43 Z" fill="url(#chessGradLight)" />
    <!-- Center royal cross finial -->
    <rect x="26.5" y="6" width="3" height="7" rx="1" fill="#DB2777" />
    <rect x="24" y="8" width="8" height="2.5" rx="0.8" fill="#DB2777" />
    <!-- Inner crown jewels -->
    <circle cx="28" cy="22" r="2.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="20" cy="24" r="1.8" fill="#FDF4FF" opacity="0.75" />
    <circle cx="36" cy="24" r="1.8" fill="#FDF4FF" opacity="0.75" />
  </g>

  <!-- Typography -->
  <!-- "WINCY" wordmark in deep red serif font -->
  <text x="64" y="34" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#DC2626">
    WINCY
  </text>

  <!-- "SOFTWARE SOLUTIONS" in bold pink caps -->
  <text x="65" y="49" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#BE185D">
    SOFTWARE SOLUTIONS
  </text>
</svg>
